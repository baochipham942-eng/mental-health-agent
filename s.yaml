edition: 3.0.0
name: mental-health-agent-app

vars:
  region: "ap-southeast-1"

resources:
  framework:
    component: fc3
    props:
      region: ${vars.region}
      functionName: "mind"
      description: '心理疗愈 Agent - Next.js Standalone 部署 (Custom Domain)'
      runtime: custom.debian10
      cpu: 1
      memorySize: 1024
      diskSize: 512
      timeout: 180
      instanceConcurrency: 5
      code: ./.next/standalone
      customRuntimeConfig:
        command:
          - /var/fc/lang/nodejs20/bin/node
          - server.js
        port: 3000
      triggers:
        - triggerName: http-trigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
      environmentVariables:
        PORT: "3000"
        NODE_ENV: "production"
        NEXTAUTH_URL: "https://mental.llmxy.xyz"
        NEXTAUTH_SECRET: ${env(NEXTAUTH_SECRET)}
        AUTH_SECRET: ${env(AUTH_SECRET)}
        AUTH_TRUST_HOST: "true"
        DATABASE_URL: ${env(DATABASE_URL)}
        DATABASE_URL_UNPOOLED: ${env(DATABASE_URL_UNPOOLED)}
        DEFAULT_LLM_PROVIDER: ${env(DEFAULT_LLM_PROVIDER)}
        DEEPSEEK_API_KEY: ${env(DEEPSEEK_API_KEY)}
        GROQ_API_KEY: ${env(GROQ_API_KEY)}
        OPENROUTER_API_KEY: ${env(OPENROUTER_API_KEY)}
        OPENROUTER_API_BASE_URL: ${env(OPENROUTER_API_BASE_URL)}
        OPENROUTER_CHAT_MODEL: ${env(OPENROUTER_CHAT_MODEL)}
        OPENROUTER_FAST_MODEL: ${env(OPENROUTER_FAST_MODEL)}
        FAST_AGENT_PROVIDER: ${env(FAST_AGENT_PROVIDER)}
        OPENAI_API_KEY: ${env(OPENAI_API_KEY)}
        OPENAI_API_BASE_URL: ${env(OPENAI_API_BASE_URL)}
        OPENAI_CHAT_MODEL: ${env(OPENAI_CHAT_MODEL)}
        MENTAL_WEBSEARCH_PROVIDER: ${env(MENTAL_WEBSEARCH_PROVIDER)}
        MENTAL_WEBSEARCH_MODEL: ${env(MENTAL_WEBSEARCH_MODEL)}
        LANGFUSE_SECRET_KEY: ${env(LANGFUSE_SECRET_KEY)}
        LANGFUSE_PUBLIC_KEY: ${env(LANGFUSE_PUBLIC_KEY)}
        LANGFUSE_BASE_URL: ${env(LANGFUSE_BASE_URL)}
        LANGFUSE_ENABLED: "true"
        ADMIN_PHONES: ${env(ADMIN_PHONES)}
        ADMIN_USERNAMES: ${env(ADMIN_USERNAMES)}
      customDomains:
        - domainName: mental.llmxy.xyz
          protocol: HTTPS
          certId: "cert-15340472"
          routeConfigs:
            - path: /*
              functionName: "mind"
